<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHADOWLINE — The Meridian Archive</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0d12; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #selftest-results { display: none; }
</style>
</head>
<body>
<canvas id="game" aria-label="SHADOWLINE: a top-down stealth game. Collect 3 intel cores per floor and reach the exit unseen."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="selftest-results"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
